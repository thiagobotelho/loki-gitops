apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  # Namespace deste objeto; não confundir com seleção de namespaces de origem.
  namespace: openshift-logging
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  accessModes: ["ReadWriteOnce"]
  # Recursos ou dependências desta seção; avaliar seu escopo antes de alterar.
  resources:
    requests:
      storage: 10Gi
