apiVersion: v1
kind: Service
metadata:
  name: minio
  # Namespace deste objeto; não confundir com seleção de namespaces de origem.
  namespace: openshift-logging
  annotations:
    argocd.argoproj.io/sync-wave: "7"
spec:
  # Seletores precisam corresponder aos labels dos recursos de destino.
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
