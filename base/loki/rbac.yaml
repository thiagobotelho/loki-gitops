apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openshift-logging-loki-gateway-tokenreviewer
  annotations:
    argocd.argoproj.io/sync-wave: "19"
rules:
  - apiGroups:
      - authentication.k8s.io
    resources:
      - tokenreviews
    verbs:
      - create
  - apiGroups:
      - authorization.k8s.io
    resources:
      - subjectaccessreviews
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openshift-logging-loki-gateway-tokenreviewer
  annotations:
    argocd.argoproj.io/sync-wave: "19"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: openshift-logging-loki-gateway-tokenreviewer
subjects:
  - kind: ServiceAccount
    name: loki-gateway
    namespace: openshift-logging
