apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: minio-crc
  namespace: openshift-logging
  annotations:
    argocd.argoproj.io/sync-wave: '4'
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: minio-crc
  namespace: openshift-logging
  annotations:
    argocd.argoproj.io/sync-wave: '4'
spec:
  runPolicy: Serial
  source:
    type: Git
    git:
      uri: https://github.com/minio/minio.git
      ref: 07c3a429bfed433e49018cb0f78a52145d4bedeb
    dockerfile: 'FROM docker.io/library/golang@sha256:672c944cfd07599b5f1bb179869270cdc94c6254e41db4d431259693cb286b82
      AS build

      WORKDIR /src

      COPY . .

      ENV CGO_ENABLED=0 GOTOOLCHAIN=local

      RUN go build -p 2 -trimpath -o /out/minio .

      FROM registry.access.redhat.com/ubi9/ubi-minimal@sha256:34880b64c07f28f64d95737f82f891516de9a3b43583f39970f7bf8e4cfa48b7

      COPY --from=build /out/minio /usr/local/bin/minio

      COPY LICENSE /usr/share/licenses/minio/LICENSE

      ENV HOME=/tmp

      USER 1001

      ENTRYPOINT ["/usr/local/bin/minio"]

      '
  strategy:
    type: Docker
    dockerStrategy: {}
  output:
    to:
      kind: ImageStreamTag
      name: minio-crc:RELEASE.2025-09-07T16-13-09Z
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: '3'
      memory: 4Gi
  successfulBuildsHistoryLimit: 1
  failedBuildsHistoryLimit: 1
---
