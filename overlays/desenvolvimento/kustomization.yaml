apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
- crc-image-builds.yaml
- crc-image-bootstrap.yaml
- ovn-audit-rbac.yaml
labels:
- pairs:
    app.kubernetes.io/name: loki
    app.kubernetes.io/instance: loki-desenvolvimento
    app.kubernetes.io/component: logging
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/environment: desenvolvimento
  includeSelectors: false
patches:
- path: ovn-audit-patch.yaml
  target:
    group: observability.openshift.io
    version: v1
    kind: ClusterLogForwarder
    name: instance
    namespace: openshift-logging
- target:
    group: loki.grafana.com
    version: v1
    kind: LokiStack
    name: loki
    namespace: openshift-logging
  patch: "- op: add\n  path: /spec/storageClassName\n  value: crc-csi-hostpath-provisioner"
- target:
    version: v1
    kind: PersistentVolumeClaim
    name: minio-data
    namespace: openshift-logging
  patch: "- op: add\n  path: /spec/storageClassName\n  value: crc-csi-hostpath-provisioner"
- target:
    group: loki.grafana.com
    kind: LokiStack
  patch: "- op: replace\n  path: /spec/storageClassName\n  value: crc-csi-hostpath-provisioner"
- target:
    group: apps
    version: v1
    kind: Deployment
    name: minio
    namespace: openshift-logging
  patch: |-
    - op: replace
      path: /metadata/annotations/argocd.argoproj.io~1sync-wave
      value: "6"
- target:
    version: v1
    kind: PersistentVolumeClaim
    name: minio-data
    namespace: openshift-logging
  patch: |-
    - op: replace
      path: /metadata/annotations/argocd.argoproj.io~1sync-wave
      value: "6"

images:
- name: quay.io/minio/minio
  newName: image-registry.openshift-image-registry.svc:5000/openshift-logging/minio-crc
  newTag: RELEASE.2025-09-07T16-13-09Z
- name: quay.io/minio/mc
  newName: image-registry.openshift-image-registry.svc:5000/openshift-logging/mc-crc
  newTag: RELEASE.2025-08-13T08-35-41Z
